let state='start';
let score=0,bestScore=0,speed=5,frameCount=0;
let shakeX=0,shakeY=0;
let lastSpeedLevel=0;
let speedUpTimer=0; // for flash notification

const player={x:150,y:GROUND,vy:0,onGround:true,bounce:0,rot:0};
const GRAVITY=0.6;
const JUMP=-14;

let bottles=[];
let nextBottle=100;
let particles=[];

let clouds=[];
for(let i=0;i<5;i++){
    clouds.push({x:Math.random()*W,y:15+Math.random()*60,w:50+Math.random()*70,sp:0.15+Math.random()*0.3,op:0.35+Math.random()*0.3});
}

let kangooX=700;
let groundOffset=0;
let signX=W+100;
let signShown=false;

// Buildings
let buildings=[];
for(let i=0;i<12;i++){
    buildings.push({
        x:i*85,
        w:60+Math.random()*30,
        h:70+Math.random()*90,
        lum:62+Math.random()*18,
        sat:12+Math.random()*15,
        hue:28+Math.random()*22,
        wCols:Math.floor(Math.random()*3)+2,
        roof:Math.random()>0.35
    });
}

// ===== SPEED: big jump every 5 obstacles =====
function getSpeed(){
    const level=Math.floor(score/5);
    // +1.5 per level -> really noticeable!
    // Level 0: 5, Level 1: 6.5, Level 2: 8, Level 3: 9.5, Level 4: 11...
    return Math.min(5+level*1.5, 14);
}

// ===== BORDEAUX CITYSCAPE =====
function drawCity(){
    const sg=ctx.createLinearGradient(0,0,0,GROUND);
    sg.addColorStop(0,'#5B8CC0');
    sg.addColorStop(0.4,'#8AB0D5');
    sg.addColorStop(0.75,'#C8D8E8');
    sg.addColorStop(1,'#E8DDD0');
    ctx.fillStyle=sg;
    ctx.fillRect(0,0,W,GROUND);

    clouds.forEach(c=>{
        c.x-=c.sp;
        if(c.x+c.w<-20){c.x=W+40;c.y=15+Math.random()*60;}
        ctx.fillStyle='rgba(255,255,255,'+c.op+')';
        ctx.beginPath();ctx.ellipse(c.x,c.y,c.w/2,12,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(c.x-c.w*0.2,c.y+5,c.w*0.25,10,0,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.ellipse(c.x+c.w*0.22,c.y+3,c.w*0.28,11,0,0,Math.PI*2);ctx.fill();
    });

    // Cathedral
    const spX=((450-groundOffset*0.15)%1000+1000)%1000-50;
    ctx.fillStyle='#c8b898';
    ctx.fillRect(spX-7,GROUND-190,14,190);
    ctx.fillStyle='#5a6070';
    ctx.beginPath();ctx.moveTo(spX-9,GROUND-190);ctx.lineTo(spX,GROUND-230);ctx.lineTo(spX+9,GROUND-190);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#444';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(spX,GROUND-230);ctx.lineTo(spX,GROUND-242);ctx.stroke();
    ctx.beginPath();ctx.moveTo(spX-4,GROUND-238);ctx.lineTo(spX+4,GROUND-238);ctx.stroke();

    buildings.forEach(b=>{
        const bx=((b.x-groundOffset*0.25)%1050+1050)%1050-60;
        const by=GROUND-b.h;
        ctx.fillStyle='hsl('+b.hue+','+b.sat+'%,'+b.lum+'%)';
        ctx.fillRect(bx,by,b.w,b.h);
        if(b.roof){
            ctx.fillStyle='#5a6070';
            ctx.beginPath();ctx.moveTo(bx-2,by);ctx.lineTo(bx+b.w/2,by-16);ctx.lineTo(bx+b.w+2,by);ctx.closePath();ctx.fill();
        }
        ctx.fillStyle='rgba(180,210,240,0.65)';
        const ww=7,wh=9,gap=4;
        const sx=bx+(b.w-b.wCols*(ww+gap)+gap)/2;
        for(let r=0;r<Math.floor(b.h/20);r++){
            for(let c=0;c<b.wCols;c++){
                const wx=sx+c*(ww+gap);
                const wy=by+10+r*18;
                if(wy+wh<GROUND-4){
                    ctx.fillRect(wx,wy,ww,wh);
                    ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.5;
                    ctx.strokeRect(wx,wy,ww,wh);
                }
            }
        }
        ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1;ctx.strokeRect(bx,by,b.w,b.h);
    });
}

function drawKangoo(){
    kangooX-=speed*0.12;
    if(kangooX<-160)kangooX=W+250+Math.random()*400;
    if(kangooImg.complete){
        const sc=0.42;
        const kw=kangooImg.width*sc,kh=kangooImg.height*sc;
        ctx.globalAlpha=0.85;
        ctx.drawImage(kangooImg,kangooX,GROUND-kh+5,kw,kh);
        ctx.globalAlpha=1;
    }
}

function drawGround(){
    const gg=ctx.createLinearGradient(0,GROUND,0,H);
    gg.addColorStop(0,'#8a8070');
    gg.addColorStop(0.3,'#7a7060');
    gg.addColorStop(1,'#5a5040');
    ctx.fillStyle=gg;
    ctx.fillRect(0,GROUND,W,H-GROUND);
    ctx.fillStyle='#9a9080';ctx.fillRect(0,GROUND,W,4);

    groundOffset=(groundOffset+speed)%30;
    ctx.strokeStyle='rgba(0,0,0,0.07)';ctx.lineWidth=1;
    for(let row=0;row<3;row++){
        const ry=GROUND+6+row*16;
        const off=(row%2)*15-groundOffset;
        for(let gx=off;gx<W;gx+=30)ctx.strokeRect(gx,ry,28,14);
    }
}

function drawSign(x){
    ctx.save();ctx.translate(x,GROUND-80);
    ctx.fillStyle='#777';ctx.fillRect(-3,22,6,60);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.roundRect(-55,-14,110,38,5);ctx.fill();
    ctx.strokeStyle='#cc0000';ctx.lineWidth=3;
    ctx.beginPath();ctx.roundRect(-55,-14,110,38,5);ctx.stroke();
    ctx.fillStyle='#222';ctx.font='bold 17px Georgia,serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Bordeaux',0,4);
    ctx.restore();
}

function drawWaterBottle(x,y,h){
    const bw=22,bh=h;
    ctx.save();ctx.translate(x,y);

    ctx.fillStyle='rgba(0,0,0,0.1)';
    ctx.beginPath();ctx.ellipse(0,bh/2+3,13,4,0,0,Math.PI*2);ctx.fill();

    const grad=ctx.createLinearGradient(-bw/2,-bh/2,bw/2,bh/2);
    grad.addColorStop(0,'rgba(190,228,255,0.92)');
    grad.addColorStop(0.5,'rgba(110,190,255,0.88)');
    grad.addColorStop(1,'rgba(70,155,240,0.92)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(-bw/2+2,-bh/2+8);
    ctx.quadraticCurveTo(-bw/2-1,bh/2-3,-bw/2+1,bh/2);
    ctx.lineTo(bw/2-1,bh/2);
    ctx.quadraticCurveTo(bw/2+1,-bh/2+8,bw/2-2,-bh/2+8);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(50,120,200,0.4)';ctx.lineWidth=1;ctx.stroke();

    ctx.fillStyle='rgba(30,120,220,0.3)';
    ctx.beginPath();
    ctx.moveTo(-bw/2+3,5);ctx.quadraticCurveTo(0,2,bw/2-3,5);
    ctx.lineTo(bw/2-2,bh/2-1);ctx.lineTo(-bw/2+2,bh/2-1);
    ctx.closePath();ctx.fill();

    ctx.fillStyle='#fff';ctx.fillRect(-bw/2+4,-3,bw-8,14);
    ctx.fillStyle='#2080cc';ctx.font='bold 6px Arial';ctx.textAlign='center';
    ctx.fillText('EAU',0,8);

    ctx.fillStyle='rgba(190,225,255,0.8)';ctx.fillRect(-4,-bh/2,8,10);
    ctx.fillStyle='#1565C0';
    ctx.beginPath();ctx.roundRect(-5,-bh/2-6,10,7,2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(-bw/2+4,-bh/2+10,3,bh-14);

    ctx.restore();
}

function drawPlayer(px,py,rot){
    ctx.save();ctx.translate(px,py);ctx.rotate(rot);

    const ss=player.onGround?1:Math.max(0.3,1-(GROUND-player.y)/250);
    ctx.globalAlpha=0.2*ss;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(0,2,28*ss,5*ss,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;

    if(charImg.complete){
        const sc=0.38;
        const sw=charImg.width*sc,sh=charImg.height*sc;
        ctx.drawImage(charImg,-sw/2,-sh,sw,sh);
    }
    ctx.restore();
}

// ===== PARTICLES =====
function spawnP(x,y){
    for(let i=0;i<8;i++){
        particles.push({x:x+Math.random()*20-10,y:y,vx:(Math.random()-0.5)*5,vy:-Math.random()*3-1,life:1,sz:2+Math.random()*2,c:['#9a9080','#8a7a68','#7a6a58'][Math.floor(Math.random()*3)]});
    }
}
function updateP(){
    for(let i=particles.length-1;i>=0;i--){
        const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life-=0.03;
        if(p.life<=0)particles.splice(i,1);
    }
}
function drawP(){
    particles.forEach(p=>{
        ctx.globalAlpha=p.life;ctx.fillStyle=p.c;
        ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();
    });ctx.globalAlpha=1;
}

// ===== SPEED UP FLASH =====
function drawSpeedUp(){
    if(speedUpTimer>0){
        speedUpTimer--;
        const alpha=speedUpTimer/60;
        const yOff=-30+((60-speedUpTimer)*0.5);
        ctx.save();
        ctx.globalAlpha=alpha;
        ctx.fillStyle='#ff6600';
        ctx.font='bold 28px \"Segoe UI\",Arial';
        ctx.textAlign='center';
        ctx.fillText('SPEED UP!',W/2,H/2-40+yOff);
        // Also draw the new level
        const lvl=Math.floor(score/5)+1;
        ctx.font='bold 20px Arial';
        ctx.fillStyle='#ffcc00';
        ctx.fillText('Vitesse x'+lvl,W/2,H/2-10+yOff);
        ctx.restore();
    }
}

// ===== GAME LOGIC =====
function jump(){
    if(state==='start'){state='play';signX=W+100;signShown=false;return;}
    if(state==='over'){resetG();return;}
    if(player.onGround){player.vy=JUMP;player.onGround=false;}
}

function resetG(){
    score=0;speed=5;bottles=[];particles=[];
    player.y=GROUND;player.vy=0;player.onGround=true;player.rot=0;player.bounce=0;
    nextBottle=100;frameCount=0;shakeX=0;shakeY=0;
    signX=W+100;signShown=false;lastSpeedLevel=0;speedUpTimer=0;
    state='play';
}

function update(){
    if(state!=='play')return;
    frameCount++;

    // Speed: +1.5 every 5 obstacles, cap 14
    const newSpeed=getSpeed();
    const curLevel=Math.floor(score/5);
    if(curLevel>lastSpeedLevel){
        lastSpeedLevel=curLevel;
        speedUpTimer=60; // show flash for 1 second
    }
    speed=newSpeed;

    player.vy+=GRAVITY;player.y+=player.vy;
    let wasAir=!player.onGround;
    if(player.y>=GROUND){player.y=GROUND;player.vy=0;player.onGround=true;if(wasAir)spawnP(player.x,GROUND);}

    if(player.onGround){player.bounce=Math.sin(frameCount*0.1)*1.5;player.rot*=0.85;}
    else{player.bounce=0;player.rot=player.vy*0.006;player.rot=Math.max(-0.1,Math.min(0.12,player.rot));}

    // Bordeaux sign at start
    if(!signShown&&frameCount>20&&frameCount<25){signX=W+100;signShown=true;}
    if(signShown&&signX>-100)signX-=speed;

    // Spawn bottles
    nextBottle--;
    if(nextBottle<=0){
        bottles.push({x:W+20,h:38+Math.random()*18,scored:false});
        // Spawn interval also decreases with level
        nextBottle=65+Math.random()*40-curLevel*4;
        if(nextBottle<25)nextBottle=25;
    }

    for(let i=bottles.length-1;i>=0;i--){
        const b=bottles[i];b.x-=speed;
        if(!b.scored&&b.x+10<player.x-18){b.scored=true;score++;}
        if(b.x<-40){bottles.splice(i,1);continue;}

        const py=player.y+player.bounce;
        if(player.x+18>b.x-11+3&&player.x-18<b.x+11-3&&py>GROUND-b.h-5+8&&py-75<GROUND){
            state='over';if(score>bestScore)bestScore=score;shakeX=10;shakeY=6;
        }
    }
    shakeX*=0.88;shakeY*=0.88;
}

// ===== RENDER =====
function render(){
    ctx.clearRect(0,0,W,H);ctx.save();
    if(state==='over')ctx.translate((Math.random()-0.5)*shakeX,(Math.random()-0.5)*shakeY);

    drawCity();drawKangoo();drawGround();
    if(signShown&&signX>-100)drawSign(signX);
    bottles.forEach(b=>drawWaterBottle(b.x,GROUND-b.h/2,b.h));
    drawPlayer(player.x,player.y+player.bounce,player.rot);
    drawP();
    drawSpeedUp();

    // Score HUD
    const lvl=Math.floor(score/5)+1;
    ctx.fillStyle='rgba(0,0,0,0.25)';
    ctx.beginPath();ctx.roundRect(W-165,8,155,58,8);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 22px \"Segoe UI\",Arial';ctx.textAlign='right';
    ctx.fillText('Score: '+score,W-18,35);
    ctx.font='13px Arial';
    // Color changes with speed level
    const lvlColor=lvl<=2?'rgba(255,255,255,0.5)':lvl<=4?'#ffcc44':'#ff6644';
    ctx.fillStyle=lvlColor;
    ctx.fillText('Vitesse x'+lvl,W-18,52);
    if(bestScore>0){ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fillText('Record: '+bestScore,W-18,66);}

    ctx.restore();

    // ===== START SCREEN =====
    if(state==='start'){
        ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,W,H);

        ctx.save();ctx.translate(W/2,H/2-80);
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.roundRect(-110,-30,220,60,6);ctx.fill();
        ctx.strokeStyle='#cc0000';ctx.lineWidth=4;
        ctx.beginPath();ctx.roundRect(-110,-30,220,60,6);ctx.stroke();
        ctx.fillStyle='#222';ctx.font='bold 32px Georgia,serif';
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('Bordeaux',0,0);
        ctx.restore();

        if(charImg.complete){
            const s=0.35,cw=charImg.width*s,ch=charImg.height*s;
            ctx.drawImage(charImg,W/2-cw/2,H/2-10,cw,ch);
        }

        ctx.font='18px Arial';ctx.fillStyle='#e0e0e0';ctx.textAlign='center';
        ctx.fillText("Saute par-dessus les bouteilles d'eau !",W/2,H/2-22);

        const pa=0.5+Math.sin(Date.now()*0.005)*0.5;
        ctx.globalAlpha=pa;ctx.font='bold 16px Arial';ctx.fillStyle='#FFD700';
        ctx.fillText('[ ESPACE / CLIC / TOUCHER pour jouer ]',W/2,H/2+130);
        ctx.globalAlpha=1;
    }

    // ===== GAME OVER =====
    if(state==='over'){
        ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#ff4444';ctx.font='bold 42px \"Segoe UI\",Arial';ctx.textAlign='center';
        ctx.fillText('GAME OVER',W/2,H/2-50);
        ctx.fillStyle='#fff';ctx.font='bold 28px Arial';
        ctx.fillText('Score: '+score,W/2,H/2);
        const lvl2=Math.floor(score/5)+1;
        ctx.font='16px Arial';ctx.fillStyle='rgba(255,255,255,0.6)';
        ctx.fillText('Vitesse atteinte: x'+lvl2,W/2,H/2+30);
        if(score===bestScore&&score>0){ctx.fillStyle='#FFD700';ctx.font='20px Arial';ctx.fillText('Nouveau record !',W/2,H/2+60);}
        const p2=0.5+Math.sin(Date.now()*0.005)*0.5;
        ctx.globalAlpha=p2;ctx.font='17px Arial';ctx.fillStyle='#bbb';
        ctx.fillText('[ ESPACE / CLIC / TOUCHER pour rejouer ]',W/2,H/2+100);
        ctx.globalAlpha=1;
    }
}

function gameLoop(){update();updateP();render();requestAnimationFrame(gameLoop);}

// ===== INPUT: Keyboard + Mouse + Touch =====
window.addEventListener('keydown',e=>{
    if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}
});
canvas.addEventListener('click',e=>{e.preventDefault();jump();});
canvas.addEventListener('mousedown',e=>{e.preventDefault();});
document.addEventListener('touchstart',e=>{e.preventDefault();jump();},{passive:false});
document.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
</script>
</body>
